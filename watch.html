<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>특정 사용자 채팅 모아보기</title>
  <link rel="stylesheet" href="watch.css">
</head>
<body>
  <header>
    <h1>특정 사용자 채팅 모아보기</h1>
    <div id="status">원본 채팅 연결 중…</div>
    <div class="controls">
      <label><input type="checkbox" id="autoScroll" checked> 새 메시지 자동 스크롤</label>
      <span class="buttons">
        <button id="pip" type="button" hidden>항상 위(PiP)</button>
        <button id="clear" type="button">목록 비우기</button>
      </span>
    </div>
  </header>
  <main id="messages" role="log" aria-live="polite"></main>
  <p id="pipNotice" hidden></p>
  <footer>현재 페이지에서 수집 시작 후 화면에 전달된 메시지 최대 1,000건만 표시합니다. 닉네임이 바뀌면 팝업에서 대상을 수정하세요. 삭제·차단 내용은 동기화되지 않습니다. 「항상 위(PiP)」를 누르면 목록을 다른 창 위에 고정합니다. PiP 창은 하나만 열 수 있어 채팅 PiP와 동시에 띄울 수 없습니다.</footer>
  <script src="chat-font.js"></script>
  <script src="watch.js"></script>
</body>
</html>
